<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Tracker</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#fff;--sub:#8e8e93;--acc:#0a84ff;--green:#30d158;--red:#ff453a;--line:#38383a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5}
header h1{font-size:17px;margin:0;text-align:center}
header>*:last-child{justify-self:end}
main{padding:8px 14px 24px}
button{font:inherit;color:var(--acc);background:none;border:0;padding:8px;cursor:pointer}
button:disabled{opacity:.35}
.primary{background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
.link{color:var(--acc)}
.ghost{color:var(--sub);font-size:18px;padding:6px 10px}
.red{color:var(--red);font-size:15px}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
.list li{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list small,.card small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:12px 0}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.cardhead b{font-size:17px}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.sn{flex:1;color:var(--sub);font-size:15px}
.num{width:64px;background:var(--card2);color:var(--text);border:0;border-radius:8px;padding:9px 6px;text-align:center;font-size:16px}
.u{color:var(--sub);font-size:14px;min-width:26px}
.rest{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.step{background:var(--card2);color:var(--text);border-radius:8px;width:44px;margin-left:8px;font-size:20px}
.note{padding-bottom:2px}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:18px}
.hint{color:var(--sub);text-align:center;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(28,28,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;color:var(--sub);padding:10px 0 8px;font-size:11px}
nav button span{display:block;font-size:22px;line-height:26px}
nav button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.pad{padding:4px 14px 20px}
.search,.field{width:100%;background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:11px 12px;font-size:16px;margin:6px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{background:var(--card2);color:var(--text);border-radius:99px;padding:6px 14px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--acc)}
h3{font-size:13px;color:var(--sub);text-transform:uppercase;margin:18px 4px 6px;font-weight:600}
.exrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 16px;border-bottom:1px solid var(--line)}
.exrow span{color:var(--acc);font-size:20px}
.exrow.added{opacity:.5}.exrow.added span{color:var(--green)}
.exrow small{display:block;color:var(--sub);font-size:13px}
.done{font-size:30px;color:var(--sub);padding:0 4px;line-height:1}
.done.on{color:var(--green)}
.row-done{opacity:.55}
.restbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card2);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:8px;z-index:9;box-shadow:0 4px 20px rgba(0,0,0,.6)}
.restbar b{font-size:22px;font-variant-numeric:tabular-nums;flex:1}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;color:var(--text);border-radius:8px}
.seg button.on{background:var(--acc)}
.dialog{padding:20px 14px;display:flex;flex-direction:column;gap:10px}
.dialog button{background:var(--card);border-radius:12px;padding:14px;font-size:17px}
.dialog .danger{color:var(--red)}
#elapsed{font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ Konstanten & Seed ============ */
const MUSCLES=["Brust","Rücken","Schultern","Bizeps","Trizeps","Beine","Gesäß","Bauch","Waden"];
const MAX_PLANS=10;
const KG2LB=2.2046226218;
const SEED=[
["Bankdrücken","Brust",150],["Schrägbankdrücken","Brust",120],["Kurzhantel-Bankdrücken","Brust",120],["Fliegende","Brust",75],["Butterfly","Brust",75],["Dips","Brust",120],["Liegestütze","Brust",60],
["Klimmzüge","Rücken",120],["Latziehen","Rücken",90],["Langhantelrudern","Rücken",120],["Kabelrudern","Rücken",90],["Kreuzheben","Rücken",180],["Einarmiges Kurzhantelrudern","Rücken",90],["Hyperextensions","Rücken",60],
["Schulterdrücken","Schultern",120],["Seitheben","Schultern",60],["Frontheben","Schultern",60],["Reverse Butterfly","Schultern",60],["Face Pulls","Schultern",60],["Arnold Press","Schultern",90],
["Langhantel-Curls","Bizeps",75],["Kurzhantel-Curls","Bizeps",60],["Hammer-Curls","Bizeps",60],["Scott-Curls","Bizeps",75],
["Trizepsdrücken am Kabel","Trizeps",60],["French Press","Trizeps",75],["Enges Bankdrücken","Trizeps",120],["Overhead-Trizepsstrecken","Trizeps",60],
["Kniebeuge","Beine",180],["Beinpresse","Beine",120],["Rumänisches Kreuzheben","Beine",150],["Ausfallschritte","Beine",90],["Beinstrecker","Beine",75],["Beinbeuger","Beine",75],["Bulgarian Split Squat","Beine",120],
["Hip Thrust","Gesäß",120],["Glute Bridge","Gesäß",75],["Kabel-Kickbacks","Gesäß",60],
["Crunches","Bauch",45],["Beinheben hängend","Bauch",60],["Plank","Bauch",45],["Kabel-Crunches","Bauch",60],
["Wadenheben stehend","Waden",60],["Wadenheben sitzend","Waden",60]];
const STARTERS=["Bankdrücken","Kniebeuge","Kreuzheben","Klimmzüge","Schulterdrücken","Langhantelrudern"];
const ORDER=Object.fromEntries(SEED.map((s,i)=>[s[0],i]));

/* ============ IndexedDB ============ */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("gymtracker",1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("exercises",{keyPath:"name"});d.createObjectStore("plans",{keyPath:"id"});d.createObjectStore("sessions",{keyPath:"id"});d.createObjectStore("kv",{keyPath:"key"});};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);});}
const dbAll=s=>tx(s,"readonly",o=>o.getAll());
const dbGet=(s,k)=>tx(s,"readonly",o=>o.get(k));
const dbPut=(s,v)=>tx(s,"readwrite",o=>o.put(v));
const dbDel=(s,k)=>tx(s,"readwrite",o=>o.delete(k));

/* ============ State & Helfer ============ */
const S={exercises:{},plans:[],sessions:[],settings:{unit:"kg"},view:{name:"plans"},active:null,sheet:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
const pad=n=>String(n).padStart(2,"0");
const mmss=s=>Math.floor(s/60)+":"+pad(s%60);
const clock=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+":"+pad(m)+":"+pad(x):m+":"+pad(x);};
const toDisp=kg=>S.settings.unit==="kg"?kg:kg*KG2LB;
const fromDisp=v=>S.settings.unit==="kg"?v:v/KG2LB;
const fmt=n=>String(Math.round(n*10)/10).replace(".",",");
const getPlan=id=>S.plans.find(p=>p.id===id);
const savePlan=p=>dbPut("plans",p);
const saveActive=()=>S.active?dbPut("kv",{key:"active",value:S.active}):dbDel("kv","active");
const empty=(t,d)=>`<div class="empty"><b>${t}</b>${d}</div>`;
const dateStr=ts=>new Date(ts).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"});

/* ============ Audio, Wake Lock ============ */
let actx,wl=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){try{unlockAudio();const t=actx.currentTime;[0,0.25,0.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
 g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.4,t+d+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.18);o.start(t+d);o.stop(t+d+0.2);});
 if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
async function lockScreen(){try{if("wakeLock" in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}}
function unlockScreen(){try{if(wl)wl.release();}catch(e){}wl=null;}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.active)lockScreen();});

/* ============ Views ============ */
const page=(title,body,o={})=>`<header>${o.back?`<button class="link" data-act="go" data-view="${o.back.view}">‹ ${o.back.label}</button>`:"<span></span>"}<h1>${title}</h1>${o.right||"<span></span>"}</header><main>${body}</main>`;
function tabbar(){const v=S.view.name;const on=(...n)=>n.includes(v)?"on":"";
 return `<nav><button class="${on("plans","plan")}" data-act="go" data-view="plans"><span>🏋️</span>Pläne</button><button class="${on("history","session")}" data-act="go" data-view="history"><span>🕘</span>Verlauf</button><button class="${on("settings")}" data-act="go" data-view="settings"><span>⚙️</span>Einstellungen</button></nav>`;}

function viewPlans(){
 const list=S.plans.length?`<ul class="list">${S.plans.map(p=>`<li data-act="openPlan" data-id="${p.id}"><div><b>${esc(p.name)}</b><small>${p.entries.length} Übungen</small></div><span style="color:var(--sub)">›</span></li>`).join("")}</ul>`:empty("Noch keine Pläne","Tippe auf ＋, um deinen ersten Workout-Plan zu erstellen.");
 return page("Workout-Pläne",list+`<p class="hint">${S.plans.length} von ${MAX_PLANS} Plänen</p>`,{right:`<button data-act="newPlan" style="font-size:26px">＋</button>`})+tabbar();
}

function viewPlan(id){
 const p=getPlan(id);if(!p){S.view={name:"plans"};return viewPlans();}
 const u=S.settings.unit;
 const entries=p.entries.map((e,i)=>{
  const ex=S.exercises[e.exercise]||{group:"",rest:90};
  const sets=e.sets.map((s,j)=>`<div class="setrow"><span class="sn">Satz ${j+1}</span>
   <input class="num" inputmode="numeric" data-in="preps" data-i="${i}" data-j="${j}" value="${s.reps}"><span class="u">Wdh</span>
   <input class="num" inputmode="decimal" data-in="pweight" data-i="${i}" data-j="${j}" value="${fmt(toDisp(s.weight))}"><span class="u">${u}</span>
   <button class="ghost" data-act="rmSet" data-i="${i}" data-j="${j}">−</button></div>`).join("");
  return `<section class="card"><div class="cardhead"><div><b>${esc(e.exercise)}</b><small>${esc(ex.group)}</small></div><button class="red" data-act="rmEntry" data-i="${i}">Entfernen</button></div>${sets}
   <button class="link" data-act="addSet" data-i="${i}">＋ Satz hinzufügen</button>
   <div class="rest"><span>Satzpause: ${ex.rest?mmss(ex.rest)+" min":"keine"}</span><span><button class="step" data-act="restDec" data-ex="${esc(e.exercise)}">−</button><button class="step" data-act="restInc" data-ex="${esc(e.exercise)}">＋</button></span></div>
   <small class="note">Gilt für diese Übung in allen Plänen.</small></section>`;}).join("");
 const body=(p.entries.length?"":empty("Plan ist leer","Füge Übungen hinzu, um loszulegen."))+entries+
  `<button class="primary" style="width:100%;margin-top:6px" data-act="openAdd">＋ Übung hinzufügen</button>
   <div style="display:flex;justify-content:space-between;margin-top:18px"><button class="link" data-act="renamePlan">Umbenennen</button><button class="red" data-act="delPlan">Plan löschen</button></div>`;
 return page(esc(p.name),body,{back:{view:"plans",label:"Pläne"},right:`<button class="primary" data-act="startWorkout" ${p.entries.length?"":"disabled"}>Start</button>`})+tabbar();
}

function viewWorkout(){
 const a=S.active,u=S.settings.unit;
 const items=a.items.map((it,i)=>{const ex=S.exercises[it.exercise]||{group:"",rest:0};
  const rows=it.sets.map((s,j)=>`<div class="setrow ${s.done?"row-done":""}"><span class="sn">${j+1}</span>
   <input class="num" inputmode="decimal" data-in="wweight" data-i="${i}" data-j="${j}" value="${fmt(toDisp(s.weight))}"><span class="u">${u}</span>
   <input class="num" inputmode="numeric" data-in="wreps" data-i="${i}" data-j="${j}" value="${s.reps}"><span class="u">Wdh</span>
   <button class="done ${s.done?"on":""}" data-act="wDone" data-i="${i}" data-j="${j}">${s.done?"●":"○"}</button></div>`).join("");
  return `<section class="card"><div class="cardhead"><div><b>${esc(it.exercise)}</b><small>${esc(ex.group)} · Pause ${ex.rest?mmss(ex.rest):"keine"}</small></div></div>${rows}<button class="link" data-act="wAddSet" data-i="${i}">＋ Satz hinzufügen</button></section>`;}).join("");
 let rest="";
 if(a.restEndsAt){const left=Math.max(0,Math.ceil((a.restEndsAt-Date.now())/1000));
  rest=`<div class="restbar"><span>⏳</span><b id="restLeft">${mmss(left)}</b><button class="step" data-act="restPlus">+15 s</button><button class="primary" data-act="restSkip">Skip</button></div>`;}
 return `<header><span id="elapsed">${clock(Date.now()-a.startedAt)}</span><h1>${esc(a.planName)}</h1><button data-act="askFinish" style="font-weight:600">Beenden</button></header><main>${items}</main>${rest}`;
}

function viewHistory(){
 const body=S.sessions.length?`<ul class="list">${S.sessions.map(s=>`<li data-act="openSession" data-id="${s.id}"><div><b>${esc(s.planName)}</b><small>${dateStr(s.startedAt)} · ${Math.round((s.endedAt-s.startedAt)/60000)} min · ${s.logs.length} Sätze</small></div><span style="color:var(--sub)">›</span></li>`).join("")}</ul>`:empty("Noch keine Trainings","Abgeschlossene Trainings erscheinen hier.");
 return page("Verlauf",body)+tabbar();
}
function viewSession(id){
 const s=S.sessions.find(x=>x.id===id);if(!s){S.view={name:"history"};return viewHistory();}
 const groups=[];s.logs.forEach(l=>{let g=groups.find(x=>x.name===l.exercise);if(!g){g={name:l.exercise,logs:[]};groups.push(g);}g.logs.push(l);});
 const body=`<p class="hint">${dateStr(s.startedAt)} · ${Math.round((s.endedAt-s.startedAt)/60000)} min</p>`+groups.map(g=>`<h3>${esc(g.name)}</h3><ul class="list">${g.logs.map(l=>`<li><span style="color:var(--sub)">Satz ${l.setNumber}</span><span>${fmt(toDisp(l.weight))} ${S.settings.unit} × ${l.reps}</span></li>`).join("")}</ul>`).join("")+
  `<div style="text-align:center;margin-top:20px"><button class="red" data-act="delSession" data-id="${s.id}">Training löschen</button></div>`;
 return page(esc(s.planName),body,{back:{view:"history",label:"Verlauf"}})+tabbar();
}
function viewSettings(){
 const u=S.settings.unit;
 return page("Einstellungen",`<h3>Gewichtseinheit</h3><div class="seg"><button class="${u==="kg"?"on":""}" data-act="unit" data-u="kg">kg</button><button class="${u==="lbs"?"on":""}" data-act="unit" data-u="lbs">lbs</button></div>
 <p class="hint">Alle Daten liegen nur auf diesem Gerät. Die App funktioniert komplett offline.</p>`)+tabbar();
}

/* ---- Sheets ---- */
function exListHTML(){
 const sh=S.sheet,p=getPlan(sh.planId);const inPlan=new Set(p.entries.map(e=>e.exercise));
 const all=Object.values(S.exercises).sort((a,b)=>a.name.localeCompare(b.name,"de"));
 const row=x=>{const added=inPlan.has(x.name);return `<div class="exrow ${added?"added":""}" ${added?"":`data-act="addEx" data-name="${esc(x.name)}"`}><div><b>${esc(x.name)}</b><small>${esc(x.group)}</small></div><span>${added?"✓":"＋"}</span></div>`;};
 const q=sh.search.trim().toLowerCase();let out="";
 if(!q&&!sh.filter){
  const avail=all.filter(x=>!inPlan.has(x.name)).sort((a,b)=>(ORDER[a.name]??999)-(ORDER[b.name]??999));
  let sug;
  if(!p.entries.length)sug=STARTERS.map(n=>avail.find(x=>x.name===n)).filter(Boolean);
  else{const used=new Set(p.entries.map(e=>(S.exercises[e.exercise]||{}).group));
   sug=avail.filter(x=>used.has(x.group)).slice(0,3);
   MUSCLES.filter(g=>!used.has(g)).slice(0,3).forEach(g=>{const f=avail.find(x=>x.group===g);if(f)sug.push(f);});}
  if(sug.length)out+=`<h3>Vorgeschlagen</h3>`+sug.map(row).join("");
 }
 const list=all.filter(x=>(!sh.filter||x.group===sh.filter)&&(!q||x.name.toLowerCase().includes(q)));
 MUSCLES.forEach(g=>{const items=list.filter(x=>x.group===g);if(items.length)out+=`<h3>${g}</h3>`+items.map(row).join("");});
 return out||empty("Nichts gefunden","Du kannst oben eine eigene Übung erstellen.");
}
function sheetHTML(){
 const sh=S.sheet;if(!sh)return "";
 if(sh.type==="add")return `<div class="sheet"><header><span></span><h1>Übung hinzufügen</h1><button class="link" data-act="closeSheet" style="font-weight:600">Fertig</button></header>
  <div class="pad"><input id="exsearch" class="search" type="search" placeholder="Übung suchen" value="${esc(sh.search)}" data-in="exsearch">
  <div class="chips">${["Alle",...MUSCLES].map(g=>`<button class="chip ${(g==="Alle"?!sh.filter:sh.filter===g)?"on":""}" data-act="chip" data-g="${g}">${g}</button>`).join("")}</div>
  <button class="link" data-act="openCustom">＋ Eigene Übung erstellen</button></div><div id="exList" class="pad">${exListHTML()}</div></div>`;
 if(sh.type==="custom")return `<div class="sheet"><header><button class="link" data-act="backToAdd">Abbrechen</button><h1>Eigene Übung</h1><button class="link" data-act="saveCustom" style="font-weight:600">Anlegen</button></header>
  <div class="pad"><input id="cname" class="field" placeholder="Name der Übung"><select id="cgroup" class="field">${MUSCLES.map(g=>`<option>${g}</option>`).join("")}</select></div></div>`;
 if(sh.type==="finish")return `<div class="sheet"><header><span></span><h1>Training beenden?</h1><span></span></header><div class="dialog">
  <button data-act="finish" data-save="1" style="color:var(--green)">Speichern &amp; beenden</button>
  <button class="danger" data-act="finish" data-save="0">Verwerfen</button>
  <button data-act="closeSheet">Weitertrainieren</button>
  <p class="hint">Beim Speichern werden deine Werte für das nächste Training dieses Plans übernommen.</p></div></div>`;
 return "";
}

/* ============ Render ============ */
let lastKey="";
function render(){
 const v=S.view;const key=v.name+":"+(v.id||"");const y=window.scrollY;
 let html;
 if(v.name==="workout")html=viewWorkout();
 else if(v.name==="plan")html=viewPlan(v.id);
 else if(v.name==="history")html=viewHistory();
 else if(v.name==="session")html=viewSession(v.id);
 else if(v.name==="settings")html=viewSettings();
 else html=viewPlans();
 document.getElementById("app").innerHTML=html+sheetHTML();
 window.scrollTo(0,key===lastKey?y:0);lastKey=key;
}
const renderExList=()=>{const el=document.getElementById("exList");if(el)el.innerHTML=exListHTML();};

/* ============ Aktionen ============ */
function addToPlan(planId,name){
 const p=getPlan(planId);p.entries.push({exercise:name,sets:[0,1,2].map(()=>({reps:10,weight:0}))});savePlan(p);
}
async function finishWorkout(save){
 const a=S.active;
 if(save){
  const p=getPlan(a.planId);const logs=[];
  a.items.forEach(it=>it.sets.forEach((s,j)=>{
   if(!s.done)return;
   logs.push({exercise:it.exercise,setNumber:j+1,reps:s.reps,weight:s.weight});
   const entry=p&&p.entries.find(e=>e.exercise===it.exercise);
   if(entry){if(j<entry.sets.length){entry.sets[j].reps=s.reps;entry.sets[j].weight=s.weight;}else entry.sets.push({reps:s.reps,weight:s.weight});}
  }));
  if(logs.length){const sess={id:uid(),planName:a.planName,startedAt:a.startedAt,endedAt:Date.now(),logs};S.sessions.unshift(sess);await dbPut("sessions",sess);if(p)await savePlan(p);}
 }
 S.active=null;await dbDel("kv","active");unlockScreen();S.sheet=null;S.view={name:"history"};render();
}

const ACT={
 go(t){S.view={name:t.dataset.view};S.sheet=null;render();},
 openPlan(t){S.view={name:"plan",id:t.dataset.id};render();},
 openSession(t){S.view={name:"session",id:t.dataset.id};render();},
 newPlan(){
  if(S.plans.length>=MAX_PLANS)return alert("Maximal "+MAX_PLANS+" Pläne. Lösche zuerst einen Plan.");
  const name=(prompt("Name des Plans:")||"").trim();if(!name)return;
  const p={id:uid(),name,createdAt:Date.now(),entries:[]};S.plans.push(p);savePlan(p);S.view={name:"plan",id:p.id};render();},
 renamePlan(){const p=getPlan(S.view.id);const n=(prompt("Neuer Name:",p.name)||"").trim();if(!n)return;p.name=n;savePlan(p);render();},
 delPlan(){const p=getPlan(S.view.id);if(!confirm("Plan „"+p.name+"“ löschen?"))return;S.plans=S.plans.filter(x=>x!==p);dbDel("plans",p.id);S.view={name:"plans"};render();},
 addSet(t){const p=getPlan(S.view.id),e=p.entries[+t.dataset.i],l=e.sets[e.sets.length-1];e.sets.push({reps:l?l.reps:10,weight:l?l.weight:0});savePlan(p);render();},
 rmSet(t){const p=getPlan(S.view.id);p.entries[+t.dataset.i].sets.splice(+t.dataset.j,1);savePlan(p);render();},
 rmEntry(t){const p=getPlan(S.view.id);p.entries.splice(+t.dataset.i,1);savePlan(p);render();},
 restDec(t){const ex=S.exercises[t.dataset.ex];ex.rest=Math.max(0,ex.rest-15);dbPut("exercises",ex);render();},
 restInc(t){const ex=S.exercises[t.dataset.ex];ex.rest=Math.min(600,ex.rest+15);dbPut("exercises",ex);render();},
 openAdd(){S.sheet={type:"add",planId:S.view.id,search:"",filter:null};render();},
 closeSheet(){S.sheet=null;render();},
 chip(t){S.sheet.filter=t.dataset.g==="Alle"?null:t.dataset.g;render();},
 addEx(t){addToPlan(S.sheet.planId,t.dataset.name);renderExList();},
 openCustom(){S.sheet={type:"custom",planId:S.sheet.planId};render();},
 backToAdd(){S.sheet={type:"add",planId:S.sheet.planId,search:"",filter:null};render();},
 saveCustom(){
  const name=document.getElementById("cname").value.trim(),g=document.getElementById("cgroup").value;if(!name)return;
  if(Object.keys(S.exercises).some(n=>n.toLowerCase()===name.toLowerCase()))return alert("Diese Übung gibt es schon.");
  const ex={name,group:g,rest:90,custom:true};S.exercises[name]=ex;dbPut("exercises",ex);addToPlan(S.sheet.planId,name);
  S.sheet={type:"add",planId:S.sheet.planId,search:"",filter:null};render();},
 startWorkout(){
  const p=getPlan(S.view.id);if(!p||!p.entries.length)return;unlockAudio();
  S.active={planId:p.id,planName:p.name,startedAt:Date.now(),restEndsAt:null,restTotal:0,
   items:p.entries.map(e=>({exercise:e.exercise,sets:e.sets.map(s=>({reps:s.reps,weight:s.weight,done:false}))}))};
  saveActive();S.view={name:"workout"};lockScreen();render();},
 wDone(t){const a=S.active,it=a.items[+t.dataset.i],s=it.sets[+t.dataset.j];s.done=!s.done;
  if(s.done){unlockAudio();const ex=S.exercises[it.exercise];if(ex&&ex.rest>0){a.restEndsAt=Date.now()+ex.rest*1000;a.restTotal=ex.rest;}}
  saveActive();render();},
 wAddSet(t){const it=S.active.items[+t.dataset.i],l=it.sets[it.sets.length-1];it.sets.push({reps:l?l.reps:10,weight:l?l.weight:0,done:false});saveActive();render();},
 restSkip(){S.active.restEndsAt=null;saveActive();render();},
 restPlus(){S.active.restEndsAt+=15000;saveActive();render();},
 askFinish(){S.sheet={type:"finish"};render();},
 finish(t){finishWorkout(t.dataset.save==="1");},
 delSession(t){if(!confirm("Dieses Training löschen?"))return;S.sessions=S.sessions.filter(x=>x.id!==t.dataset.id);dbDel("sessions",t.dataset.id);S.view={name:"history"};render();},
 unit(t){S.settings.unit=t.dataset.u;dbPut("kv",{key:"settings",value:S.settings});render();}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=ACT[t.dataset.act];if(f)f(t,e);});

document.addEventListener("input",e=>{
 const t=e.target,k=t.dataset.in;if(!k)return;
 const i=+t.dataset.i,j=+t.dataset.j;
 if(k==="exsearch"){S.sheet.search=t.value;renderExList();return;}
 if(k==="preps"||k==="pweight"){const p=getPlan(S.view.id),s=p.entries[i].sets[j];
  if(k==="preps")s.reps=Math.max(0,parseInt(t.value)||0);else s.weight=Math.max(0,fromDisp(num(t.value)));savePlan(p);return;}
 if(k==="wreps"||k==="wweight"){const s=S.active.items[i].sets[j];
  if(k==="wreps")s.reps=Math.max(0,parseInt(t.value)||0);else s.weight=Math.max(0,fromDisp(num(t.value)));saveActive();}
});

/* ============ Timer-Tick ============ */
setInterval(()=>{
 const a=S.active;if(!a)return;
 const el=document.getElementById("elapsed");if(el)el.textContent=clock(Date.now()-a.startedAt);
 if(a.restEndsAt){const left=Math.ceil((a.restEndsAt-Date.now())/1000);
  if(left<=0){const late=Date.now()-a.restEndsAt;a.restEndsAt=null;saveActive();if(late<3000)beep();render();}
  else{const r=document.getElementById("restLeft");if(r)r.textContent=mmss(left);}}
},500);

/* ============ Start ============ */
async function init(){
 db=await openDB();
 let ex=await dbAll("exercises");
 if(!ex.length){for(const [name,group,rest] of SEED){const o={name,group,rest,custom:false};await dbPut("exercises",o);ex.push(o);}}
 ex.forEach(e=>S.exercises[e.name]=e);
 S.plans=(await dbAll("plans")).sort((a,b)=>a.createdAt-b.createdAt);
 S.sessions=(await dbAll("sessions")).sort((a,b)=>b.startedAt-a.startedAt);
 const st=await dbGet("kv","settings");if(st&&st.value)S.settings=st.value;
 const ac=await dbGet("kv","active");if(ac&&ac.value){S.active=ac.value;S.view={name:"workout"};lockScreen();}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 render();
}
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
